<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamX — Live Scores & Fixtures</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0C1420;--ink-2:#121D2C;--line:#22344A;--chalk:#E8EDF2;--mute:#7D93AC;--signal:#FFC24A;--grass:#3FD69A;--radius:14px;--display:"Space Grotesk",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif}
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{background:var(--ink);color:var(--chalk);font-family:var(--body);min-height:100vh;background-image:radial-gradient(1200px 400px at 50% -180px, rgba(255,194,74,.14), transparent 70%)}
  .wrap{max-width:820px;margin:0 auto;padding:0 20px 72px}
  .topbar{display:flex;justify-content:flex-end;padding-top:20px}
  .langsw{display:flex;gap:2px;background:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:3px}
  .langsw button{background:transparent;border:0;color:var(--mute);font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:999px;cursor:pointer}
  .langsw button[aria-pressed="true"]{background:var(--signal);color:#14100A}
  header{padding:16px 0 26px;text-align:center}
  .mark{font-family:var(--display);font-weight:700;font-size:clamp(42px,11vw,78px);line-height:.9;margin:0}.mark .x{color:var(--signal)}
  .tag{margin:12px 0 0;color:var(--mute);font-size:14px}
  .controls{display:flex;flex-direction:column;gap:14px;margin:28px 0 30px}
  .leagues{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
  .chip{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--mute);font-size:14px;padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--signal);border-color:var(--signal);color:#14100A;font-weight:600}
  .daybar{display:flex;align-items:center;gap:10px;background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
  .daybtn{background:transparent;border:0;color:var(--mute);font-size:20px;cursor:pointer;padding:8px 12px}
  .daylabel{flex:1;text-align:center;font-weight:500}.daylabel small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
  #picker{background:transparent;border:0;color:var(--mute);color-scheme:dark}
  .comp{margin:0 0 10px;padding:0 4px;color:var(--mute);font-size:13px}
  .match{display:grid;grid-template-columns:1fr 92px 1fr;align-items:center;gap:8px;background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:16px 14px;margin-bottom:10px}
  .match.live{border-color:rgba(63,214,154,.5)}
  .team{display:flex;align-items:center;gap:10px}.team.away{flex-direction:row-reverse;text-align:right}
  .team img{width:30px;height:30px;object-fit:contain}.team span{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.team.loser span{color:var(--mute)}
  .center{text-align:center}.score{font-family:var(--display);font-weight:700;font-size:30px}.kick{font-family:var(--display);font-size:22px;font-weight:700}
  .state{margin-top:7px;font-size:11.5px;color:var(--mute)}.state.on{color:var(--grass)}.state.on::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--grass);margin-inline-end:5px;animation:beat 1.6s infinite}
  @keyframes beat{50%{opacity:.25}}
  .note{text-align:center;color:var(--mute);padding:56px 20px;line-height:1.8}.note b{display:block;color:var(--chalk);margin-bottom:6px}.note button{margin-top:14px;background:var(--signal);border:0;color:#14100A;font-weight:600;padding:10px 20px;border-radius:999px;cursor:pointer}
  footer{display:flex;justify-content:center;padding-top:26px;border-top:1px solid var(--line);margin-top:26px}.tg{color:var(--mute)}.tg:hover{color:var(--signal)}.tg svg{width:26px;height:26px}
  .splash{position:fixed;inset:0;z-index:9999;background:var(--ink);display:flex;align-items:center;justify-content:center}.splash-mark{font-family:var(--display);font-weight:700;font-size:clamp(46px,13vw,92px);animation:splash-reveal .9s forwards}.splash-mark .x{color:var(--signal)}.splash.hide{opacity:0;transition:.5s;pointer-events:none}
  @keyframes splash-reveal{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div class="splash" id="splash"><h1 class="splash-mark">STREAM<span class="x">X</span></h1></div>
<div class="wrap">
  <div class="topbar"><div class="langsw"><button data-lang="en" aria-pressed="true">EN</button><button data-lang="fr">FR</button></div></div>
  <header><h1 class="mark">STREAM<span class="x">X</span></h1><p class="tag" id="tag"></p></header>
  <div class="controls"><div class="leagues" id="leagues"></div><div class="daybar"><button class="daybtn" id="prev">‹</button><div class="daylabel"><span id="dayName"></span><small id="dayDate"></small></div><input type="date" id="picker"><button class="daybtn" id="next">›</button></div></div>
  <main id="out"></main>
  <footer><a class="tg" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.161c-.18 1.897-.962 6.502-1.359 8.627-.168.9-.5 1.201-.82 1.23-.697.064-1.226-.461-1.901-.903-1.056-.692-1.653-1.123-2.678-1.799-1.185-.781-.417-1.21.258-1.911.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.139-5.062 3.345-.479.329-.913.489-1.302.481-.428-.009-1.252-.242-1.865-.442-.751-.244-1.349-.374-1.297-.789.027-.216.324-.437.892-.663 3.498-1.524 5.831-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.477-1.635.099-.002.321.023.464.14.121.099.154.232.169.325.016.093.036.305.02.472z"/></svg></a></footer>
</div>
<script>
const WORKER_URL = "https://streamx-proxy.YOUR_SUBDOMAIN.workers.dev"; // <-- ضع رابط الـ Worker هنا
const LEAGUE_IDS = ["eng.1","esp.1","ita.1","ger.1","fra.1","uefa.champions","uefa.europa","ksa.1","alg.1","egy.1","mar.1","usa.1"];
const T = {
  en:{locale:"en-US",tag:"Live scores & fixtures",today:"Today",tomorrow:"Tomorrow",yesterday:"Yesterday",prevDay:"Previous day",nextDay:"Next day",notStarted:"Not started",live:"LIVE",finished:"Finished",loading:"Loading fixtures…",noMatchesTitle:"No matches",noMatchesBody:"Try another league or a different date.",errorTitle:"Couldn\'t load data",errorBody:"Check your connection and try again.",retry:"Try again",title:"StreamX — Live Scores & Fixtures",leagues:{"eng.1":"England","esp.1":"Spain","ita.1":"Italy","ger.1":"Germany","fra.1":"France","uefa.champions":"Champions League","uefa.europa":"Europa League","ksa.1":"Saudi League","alg.1":"Algeria","egy.1":"Egypt","mar.1":"Morocco","usa.1":"MLS"}},
  fr:{locale:"fr-FR",tag:"Résultats et calendrier en direct",today:"Aujourd\'hui",tomorrow:"Demain",yesterday:"Hier",prevDay:"Jour précédent",nextDay:"Jour suivant",notStarted:"Pas commencé",live:"DIRECT",finished:"Terminé",loading:"Chargement des matchs…",noMatchesTitle:"Aucun match",noMatchesBody:"Essayez une autre ligue ou une autre date.",errorTitle:"Échec du chargement",errorBody:"Vérifiez votre connexion puis réessayez.",retry:"Réessayer",title:"StreamX — Résultats et calendrier en direct",leagues:{"eng.1":"Angleterre","esp.1":"Espagne","ita.1":"Italie","ger.1":"Allemagne","fra.1":"France","uefa.champions":"Ligue des champions","uefa.europa":"Ligue Europa","ksa.1":"Championnat saoudien","alg.1":"Algérie","egy.1":"Égypte","mar.1":"Maroc","usa.1":"MLS"}}
};
const BASE = "https://site.api.espn.com/apis/site/v2/sports/soccer";
let lang=localStorage.getItem("sx-lang")||"en", league=localStorage.getItem("sx-league")||"eng.1", day=new Date(), timer=null;
const $=s=>document.querySelector(s), out=$("#out");
const ymd=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const esc=s=>String(s??"").replace(/[&<>"\']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",\'"\':"&quot;","\'":"&#39;"}[m]));
function dayWord(d){const t=T[lang],diff=Math.round((new Date(iso(d))-new Date(iso(new Date())))/86400000);if(diff===0)return t.today;if(diff===1)return t.tomorrow;if(diff===-1)return t.yesterday;return d.toLocaleDateString(t.locale,{weekday:"long"})}
function paintDay(){$("#dayName").textContent=dayWord(day);$("#dayDate").textContent=day.toLocaleDateString(T[lang].locale,{day:"numeric",month:"long",year:"numeric"});$("#picker").value=iso(day)}
function paintStatic(){document.title=T[lang].title;document.documentElement.lang=lang;$("#tag").textContent=T[lang].tag;document.querySelectorAll(".chip").forEach(c=>c.textContent=T[lang].leagues[c.dataset.id]);document.querySelectorAll(".langsw button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.lang===lang));paintDay()}
LEAGUE_IDS.forEach(id=>{const b=document.createElement("button");b.className="chip";b.dataset.id=id;b.setAttribute("aria-pressed",id===league);b.textContent=T[lang].leagues[id];b.onclick=()=>{league=id;localStorage.setItem("sx-league",league);document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.id===league));load()};$("#leagues").appendChild(b)});
document.querySelectorAll(".langsw button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem("sx-lang",lang);paintStatic();load()});
async function fetchWithCORS(url){const res=await fetch(`${WORKER_URL}/?url=${encodeURIComponent(url)}`);if(!res.ok)throw new Error(res.status);return res}
async function load(){clearTimeout(timer);paintDay();out.innerHTML=`<p class="note">${esc(T[lang].loading)}</p>`;try{const res=await fetchWithCORS(`${BASE}/${league}/scoreboard?dates=${ymd(day)}`);const data=await res.json();render(data.events||[])}catch(e){out.innerHTML=`<p class="note"><b>${esc(T[lang].errorTitle)}</b>${esc(T[lang].errorBody)}<br><button onclick="load()">${esc(T[lang].retry)}</button></p>`}}
function render(events){if(!events.length){out.innerHTML=`<p class="note"><b>${esc(T[lang].noMatchesTitle)}</b>${esc(T[lang].noMatchesBody)}</p>`;return}let live=false,html="",last="";events.forEach(ev=>{const c=ev.competitions[0],st=ev.status.type,home=c.competitors.find(x=>x.homeAway==="home"),away=c.competitors.find(x=>x.homeAway==="away");if(st.state==="in")live=true;const grp=c.notes?.[0]?.headline||"";if(grp&&grp!==last){html+=`<p class="comp">${esc(grp)}</p>`;last=grp}let middle,label,cls="state";if(st.state==="pre"){middle=`<div class="kick">${new Date(ev.date).toLocaleTimeString(T[lang].locale,{hour:"2-digit",minute:"2-digit"})}</div>`;label=T[lang].notStarted}else{middle=`<div class="score">${esc(home.score??0)} - ${esc(away.score??0)}</div>`;if(st.state==="in"){label=st.displayClock||T[lang].live;cls="state on"}else label=T[lang].finished}
html+=`<article class="match${st.state==="in"?" live":""}"><div class="team${st.state==="post"&&+home.score<+away.score?" loser":""}"><img src="${home.team.logo}" loading="lazy" onerror="this.style.visibility=\'hidden\'"><span>${esc(home.team.shortDisplayName)}</span></div><div class="center">${middle}<div class="${cls}">${esc(label)}</div></div><div class="team away${st.state==="post"&&+away.score<+home.score?" loser":""}"><img src="${away.team.logo}" loading="lazy" onerror="this.style.visibility=\'hidden\'"><span>${esc(away.team.shortDisplayName)}</span></div></article>`});out.innerHTML=html;if(live)timer=setTimeout(load,60000)}
$("#prev").onclick=()=>{day.setDate(day.getDate()-1);load()};$("#next").onclick=()=>{day.setDate(day.getDate()+1);load()};$("#picker").onchange=e=>{const[y,m,d]=e.target.value.split("-").map(Number);day=new Date(y,m-1,d);load()};
paintStatic();load();setTimeout(()=>{$("#splash").classList.add("hide");setTimeout(()=>$("#splash").remove(),550)},2000);
</script>
</body>
</html>
