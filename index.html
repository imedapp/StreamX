<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamX — Live Scores & Fixtures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0C1420;
    --ink-2:#121D2C;
    --line:#22344A;
    --chalk:#E8EDF2;
    --mute:#7D93AC;
    --signal:#FFC24A;
    --grass:#3FD69A;
    --radius:14px;
    --display:"Space Grotesk", system-ui, sans-serif;
    --body:"Inter", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--ink);
    color:var(--chalk);
    font-family:var(--body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    background-image:radial-gradient(1200px 400px at 50% -180px, rgba(255,194,74,.14), transparent 70%);
    background-repeat:no-repeat;
  }
  .wrap{max-width:820px;margin:0 auto;padding:0 20px 72px}
  .topbar{display:flex;justify-content:flex-end;padding-top:20px}
  .langsw{display:flex;gap:2px;background:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:3px}
  .langsw button{background:transparent;border:0;color:var(--mute);font-family:var(--body);font-size:12.5px;font-weight:600;letter-spacing:.03em;padding:6px 13px;border-radius:999px;cursor:pointer}
  .langsw button[aria-pressed="true"]{background:var(--signal);color:#14100A}
  header{padding:16px 0 26px;text-align:center}
  .mark{font-family:var(--display);font-weight:700;font-size:clamp(42px,11vw,78px);line-height:.9;letter-spacing:-.02em;margin:0}
  .mark .x{color:var(--signal)}
  .tag{margin:12px 0 0;color:var(--mute);font-size:14px}
  .controls{display:flex;flex-direction:column;gap:14px;margin:28px 0 30px}
  .leagues{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .leagues::-webkit-scrollbar{height:4px}
  .leagues::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .chip{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--mute);font-family:var(--body);font-size:14px;padding:9px 16px;border-radius:999px;cursor:pointer;transition:all .15s;white-space:nowrap}
  .chip:hover{color:var(--chalk);border-color:#35506e}
  .chip[aria-pressed="true"]{background:var(--signal);border-color:var(--signal);color:#14100A;font-weight:600}
  .chip:focus-visible, .daybtn:focus-visible, input:focus-visible, .langsw button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  .daybar{display:flex;align-items:center;gap:10px;background:var(--ink-2);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px}
  .daybtn{background:transparent;border:0;color:var(--mute);font-size:20px;line-height:1;cursor:pointer;padding:8px 12px;border-radius:8px}
  .daybtn:hover{color:var(--chalk);background:rgba(255,255,255,.05)}
  .daylabel{flex:1;text-align:center;font-size:15px;font-weight:500}
  .daylabel small{display:block;color:var(--mute);font-size:12px;font-weight:400;margin-top:2px}
  #picker{background:transparent;border:0;color:var(--mute);font-family:var(--body);font-size:13px;cursor:pointer;color-scheme:dark;padding:6px}
  .comp{margin:0 0 10px;padding:0 4px;color:var(--mute);font-size:13px}
  .match{display:grid;grid-template-columns:1fr 92px 1fr;align-items:center;gap:8px;background:var(--ink-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px 14px;margin-bottom:10px}
  .match.live{border-color:rgba(63,214,154,.5)}
  .team{display:flex;align-items:center;gap:10px;min-width:0}
  .team.away{flex-direction:row-reverse;text-align:right}
  .team img{width:30px;height:30px;object-fit:contain;flex:0 0 auto}
  .team span{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .team.loser span{color:var(--mute)}
  .center{text-align:center}
  .score{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;letter-spacing:.01em}
  .kick{font-family:var(--display);font-size:22px;font-weight:700;color:var(--chalk);line-height:1}
  .state{margin-top:7px;font-size:11.5px;color:var(--mute);letter-spacing:.02em}
  .state.on{color:var(--grass)}
  .state.on::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--grass);margin-inline-end:5px;vertical-align:1px;animation:beat 1.6s ease-in-out infinite}
  @keyframes beat{50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.state.on::before{animation:none}}
  .note{text-align:center;color:var(--mute);font-size:15px;padding:56px 20px;line-height:1.8}
  .note b{display:block;color:var(--chalk);font-weight:600;margin-bottom:6px;font-size:17px}
  .note button{margin-top:14px;background:var(--signal);border:0;color:#14100A;font-family:var(--body);font-weight:600;font-size:14px;padding:10px 20px;border-radius:999px;cursor:pointer}
  footer{display:flex;justify-content:center;padding-top:26px;border-top:1px solid var(--line);margin-top:26px}
  .tg{display:inline-flex;align-items:center;justify-content:center;color:var(--mute);transition:color .15s}
  .tg:hover{color:var(--signal)}
  .tg svg{width:26px;height:26px}
  @media (max-width:520px){.match{grid-template-columns:1fr 78px 1fr;padding:14px 10px}.team img{width:26px;height:26px}.team span{font-size:13.5px}.score{font-size:26px}}
  .splash{position:fixed;inset:0;z-index:9999;background:var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .splash::before{content:"";position:absolute;inset:0;background:radial-gradient(560px 320px at 50% 50%, rgba(255,194,74,.22), transparent 70%);opacity:0;animation:splash-glow 2.1s ease forwards}
  .splash-mark{position:relative;font-family:var(--display);font-weight:700;font-size:clamp(46px,13vw,92px);letter-spacing:-.02em;margin:0;opacity:0;transform:scale(.4);background:linear-gradient(100deg, var(--chalk) 42%, #fff 50%, var(--chalk) 58%);background-size:250% 100%;background-position:200% 0;-webkit-background-clip:text;background-clip:text;color:transparent;animation:splash-reveal .9s cubic-bezier(.2,.85,.25,1.2) forwards,splash-shine 1.1s ease .75s forwards}
  .splash-mark .x{color:var(--signal);-webkit-text-fill-color:var(--signal)}
  @keyframes splash-reveal{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
  @keyframes splash-shine{0%{background-position:200% 0}100%{background-position:-40% 0}}
  @keyframes splash-glow{0%{opacity:0}40%{opacity:1}75%{opacity:1}100%{opacity:0}}
  .splash.hide{opacity:0;transition:opacity .5s ease;pointer-events:none}
  @media (prefers-reduced-motion:reduce){.splash-mark{animation:none;opacity:1;transform:scale(1);background-position:0 0}.splash::before{animation:none;opacity:0}}
</style>
</head>
<body>

<div class="splash" id="splash" aria-hidden="true">
  <h1 class="splash-mark">STREAM<span class="x">X</span></h1>
</div>

<div class="wrap">
  <div class="topbar">
    <div class="langsw" role="group" aria-label="Language">
      <button data-lang="en" aria-pressed="true">EN</button>
      <button data-lang="fr" aria-pressed="false">FR</button>
    </div>
  </div>
  <header>
    <h1 class="mark">STREAM<span class="x">X</span></h1>
    <p class="tag" id="tag"></p>
  </header>
  <div class="controls">
    <div class="leagues" id="leagues"></div>
    <div class="daybar">
      <button class="daybtn" id="prev">‹</button>
      <div class="daylabel"><span id="dayName"></span><small id="dayDate"></small></div>
      <input type="date" id="picker">
      <button class="daybtn" id="next">›</button>
    </div>
  </div>
  <main id="out" aria-live="polite"></main>
  <footer>
    <a class="tg" href="#" target="_blank" rel="noopener" aria-label="Telegram">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.161c-.18 1.897-.962 6.502-1.359 8.627-.168.9-.5 1.201-.82 1.23-.697.064-1.226-.461-1.901-.903-1.056-.692-1.653-1.123-2.678-1.799-1.185-.781-.417-1.21.258-1.911.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.139-5.062 3.345-.479.329-.913.489-1.302.481-.428-.009-1.252-.242-1.865-.442-.751-.244-1.349-.374-1.297-.789.027-.216.324-.437.892-.663 3.498-1.524 5.831-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.477-1.635.099-.002.321.023.464.14.121.099.154.232.169.325.016.093.036.305.02.472z"/></svg>
    </a>
  </footer>
</div>

<script>
const LEAGUE_IDS = ["eng.1","esp.1","ita.1","ger.1","fra.1","uefa.champions","uefa.europa","ksa.1","alg.1","egy.1","mar.1","usa.1"];
const T = {
  en: {
    locale: "en-US", tag: "Live scores & fixtures", today: "Today", tomorrow: "Tomorrow", yesterday: "Yesterday",
    prevDay: "Previous day", nextDay: "Next day", notStarted: "Not started", live: "LIVE", finished: "Finished",
    loading: "Loading fixtures…", noMatchesTitle: "No matches", noMatchesBody: "Try another league or a different date.",
    errorTitle: "Couldn\'t load data", errorBody: "Check your connection and try again.", retry: "Try again", title: "StreamX — Live Scores & Fixtures",
    leagues: {"eng.1":"England","esp.1":"Spain","ita.1":"Italy","ger.1":"Germany","fra.1":"France","uefa.champions":"Champions League","uefa.europa":"Europa League","ksa.1":"Saudi League","alg.1":"Algeria","egy.1":"Egypt","mar.1":"Morocco","usa.1":"MLS"}
  },
  fr: {
    locale: "fr-FR", tag: "Résultats et calendrier en direct", today: "Aujourd\'hui", tomorrow: "Demain", yesterday: "Hier",
    prevDay: "Jour précédent", nextDay: "Jour suivant", notStarted: "Pas commencé", live: "DIRECT", finished: "Terminé",
    loading: "Chargement des matchs…", noMatchesTitle: "Aucun match", noMatchesBody: "Essayez une autre ligue ou une autre date.",
    errorTitle: "Échec du chargement", errorBody: "Vérifiez votre connexion puis réessayez.", retry: "Réessayer", title: "StreamX — Résultats et calendrier en direct",
    leagues: {"eng.1":"Angleterre","esp.1":"Espagne","ita.1":"Italie","ger.1":"Allemagne","fra.1":"France","uefa.champions":"Ligue des champions","uefa.europa":"Ligue Europa","ksa.1":"Championnat saoudien","alg.1":"Algérie","egy.1":"Égypte","mar.1":"Maroc","usa.1":"MLS"}
  }
};

const BASE = "https://site.api.espn.com/apis/site/v2/sports/soccer";
// حل CORS: نجرب مباشرة، وإذا فشل نستخدم Proxy تلقائيا
const CORS_PROXIES = [
  "https://corsproxy.io/?",
  "https://api.allorigins.win/raw?url="
];

let lang = localStorage.getItem("sx-lang") || "en";
let league = localStorage.getItem("sx-league") || "eng.1";
let day = new Date();
let timer = null;
const $ = s => document.querySelector(s);
const out = $("#out");

const ymd = d => d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0");
const iso = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const esc = s => String(s ?? "").replace(/[&<>"\']/g, m => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", \'"\':"&quot;", "\'":"&#39;" }[m]));

function dayWord(d){
  const t = T[lang];
  const today = new Date();
  const diff = Math.round((new Date(iso(d)) - new Date(iso(today))) / 86400000);
  if (diff === 0) return t.today;
  if (diff === 1) return t.tomorrow;
  if (diff === -1) return t.yesterday;
  return d.toLocaleDateString(t.locale, { weekday:"long" });
}
function paintDay(){
  const t = T[lang];
  $("#dayName").textContent = dayWord(day);
  $("#dayDate").textContent = day.toLocaleDateString(t.locale, { day:"numeric", month:"long", year:"numeric" });
  $("#picker").value = iso(day);
}
function paintStatic(){
  const t = T[lang];
  document.title = t.title;
  document.documentElement.lang = lang;
  document.documentElement.dir = "ltr";
  $("#tag").textContent = t.tag;
  $("#prev").title = t.prevDay;
  $("#next").title = t.nextDay;
  document.querySelectorAll(".chip").forEach(c => c.textContent = t.leagues[c.dataset.id] || c.dataset.id);
  document.querySelectorAll(".langsw button").forEach(x => x.setAttribute("aria-pressed", x.dataset.lang === lang));
  paintDay();
}

// بناء أزرار الدوريات
LEAGUE_IDS.forEach(id => {
  const b = document.createElement("button");
  b.className = "chip";
  b.dataset.id = id;
  b.setAttribute("aria-pressed", id === league);
  b.textContent = T[lang].leagues[id];
  b.onclick = () => {
    league = id;
    localStorage.setItem("sx-league", league);
    document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.id === league));
    load();
  };
  $("#leagues").appendChild(b);
});

document.querySelectorAll(".langsw button").forEach(b => {
  b.onclick = () => {
    lang = b.dataset.lang;
    localStorage.setItem("sx-lang", lang);
    paintStatic();
    load();
  };
});

// دالة fetch تحل مشكلة CORS نهائيا
async function fetchWithCORS(url){
  // 1. محاولة مباشرة
  try{
    const res = await fetch(url, { mode: "cors" });
    if(res.ok) return res;
    throw new Error("direct failed " + res.status);
  }catch(e){
    // 2. جرب البروكسيات واحدا تلو الآخر
    for(const proxy of CORS_PROXIES){
      try{
        const proxyUrl = proxy + encodeURIComponent(url);
        const res2 = await fetch(proxyUrl);
        if(res2.ok) return res2;
      }catch(_){}
    }
    throw e;
  }
}

async function load(){
  clearTimeout(timer);
  const t = T[lang];
  paintDay();
  out.innerHTML = `<p class="note">${esc(t.loading)}</p>`;
  const url = `${BASE}/${league}/scoreboard?dates=${ymd(day)}`;
  try{
    const res = await fetchWithCORS(url);
    const data = await res.json();
    render(data.events || []);
  }catch(e){
    console.error(e);
    out.innerHTML = `<p class="note">
      <b>${esc(t.errorTitle)}</b>
      ${esc(t.errorBody)}
      <br><button onclick="load()">${esc(t.retry)}</button>
    </p>`;
  }
}

function render(events){
  const t = T[lang];
  if(!events.length){
    out.innerHTML = `<p class="note"><b>${esc(t.noMatchesTitle)}</b>${esc(t.noMatchesBody)}</p>`;
    return;
  }
  let live = false;
  let html = "";
  let lastComp = "";
  events.forEach(ev => {
    const c  = ev.competitions[0];
    const st = ev.status.type;
    const home = c.competitors.find(x => x.homeAway === "home");
    const away = c.competitors.find(x => x.homeAway === "away");
    const running = st.state === "in";
    if(running) live = true;
    const grp = c.notes && c.notes[0] ? c.notes[0].headline : "";
    if(grp && grp !== lastComp){
      html += `<p class="comp">${esc(grp)}</p>`;
      lastComp = grp;
    }
    let middle, label, labelCls = "state";
    if(st.state === "pre"){
      middle = `<div class="kick">${new Date(ev.date).toLocaleTimeString(t.locale,{hour:"2-digit",minute:"2-digit"})}</div>`;
      label  = t.notStarted;
    }else{
      middle = `<div class="score">${esc(home.score ?? 0)} - ${esc(away.score ?? 0)}</div>`;
      if(running){
        label = st.displayClock ? st.displayClock : t.live;
        labelCls = "state on";
      }else{
        label = t.finished;
      }
    }
    const hLose = st.state === "post" && Number(home.score) < Number(away.score) ? " loser" : "";
    const aLose = st.state === "post" && Number(away.score) < Number(home.score) ? " loser" : "";
    const hLogo = home.team.logo || `https://a.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F${home.team.id}.png&w=60&h=60`;
    const aLogo = away.team.logo || `https://a.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F${away.team.id}.png&w=60&h=60`;
    html += `
      <article class="match${running ? " live" : ""}">
        <div class="team${hLose}">
          <img src="${hLogo}" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">
          <span>${esc(home.team.shortDisplayName || home.team.displayName)}</span>
        </div>
        <div class="center">
          ${middle}
          <div class="${labelCls}">${esc(label)}</div>
        </div>
        <div class="team away${aLose}">
          <img src="${aLogo}" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">
          <span>${esc(away.team.shortDisplayName || away.team.displayName)}</span>
        </div>
      </article>`;
  });
  out.innerHTML = html;
  if(live) timer = setTimeout(load, 60000);
}

$("#prev").onclick = () => { day.setDate(day.getDate() - 1); load(); };
$("#next").onclick = () => { day.setDate(day.getDate() + 1); load(); };
$("#picker").onchange = e => {
  if(!e.target.value) return;
  const [y,m,d] = e.target.value.split("-").map(Number);
  day = new Date(y, m-1, d);
  load();
};

// تهيئة أولية
document.querySelectorAll(".langsw button").forEach(x => x.setAttribute("aria-pressed", x.dataset.lang === lang));
paintStatic();
load();

const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const splash = document.getElementById("splash");
setTimeout(() => {
  splash.classList.add("hide");
  setTimeout(() => splash.remove(), 550);
}, reduced ? 500 : 2000);
</script>
</body>
</html>
